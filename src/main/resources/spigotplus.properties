# SpigotPlus runtime configuration
# Keep the prebuilt Spigot runtime separate from BuildTools.
spigot.version=26.2
java.version=26

# JVM memory
memory.min=2048M
memory.max=4096M

# Runtime compatibility plugins
geyser.version=2.11.2
viaversion.version=5.11.0
viabackwards.version=5.11.0

# Startup
startup.nogui=true
