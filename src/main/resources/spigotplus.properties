# ============================================================================
# SpigotPlus - Configuração principal
# ============================================================================
# Controla o bootstrap/distribuição do SpigotPlus.
# Configurações próprias do Minecraft continuam em server.properties.
# Reinicie o servidor após alterar valores de inicialização.

# ----------------------------------------------------------------------------
# SERVIDOR
# ----------------------------------------------------------------------------
server.spigot-version=26.2
server.java-version=26

# ----------------------------------------------------------------------------
# MEMÓRIA JVM
# ----------------------------------------------------------------------------
memory.min=2048M
memory.max=4096M

# ----------------------------------------------------------------------------
# COMPATIBILIDADE
# ----------------------------------------------------------------------------
compatibility.geyser-version=2.11.2
compatibility.viaversion-version=5.11.0
compatibility.viabackwards-version=5.11.0
compatibility.geyser-port=19132

# ----------------------------------------------------------------------------
# ATUALIZAÇÕES
# ----------------------------------------------------------------------------
updates.auto-update=true
updates.retries=3
updates.retry-delay-ms=1500

# ----------------------------------------------------------------------------
# BACKUP
# ----------------------------------------------------------------------------
backup.enabled=true
backup.directory=plugins/.backup

# ----------------------------------------------------------------------------
# DIAGNÓSTICO
# ----------------------------------------------------------------------------
diagnostics.enabled=true

# ----------------------------------------------------------------------------
# INTEGRIDADE
# ----------------------------------------------------------------------------
# Opcional: informe o SHA-256 oficial para exigir correspondência.
# sha256.Geyser-Spigot.jar=
# sha256.ViaVersion.jar=
# sha256.ViaBackwards.jar=

# ----------------------------------------------------------------------------
# LEGADO
# ----------------------------------------------------------------------------
# As chaves antigas continuam sendo aceitas para evitar quebra de instalações.
