name: SpigotPlus Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile SpigotPlus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify server artifact
        run: |
          test -f target/SpigotPlus.jar
          jar tf target/SpigotPlus.jar | grep -q 'com/donnie1337/spigotplus/bootstrap/SpigotPlusBootstrap.class'

      - name: Prepare distribution artifact
        run: |
          mkdir -p dist
          cp target/SpigotPlus.jar dist/SpigotPlus.jar
          cp src/main/resources/spigotplus.properties dist/spigotplus.properties
          sha256sum dist/SpigotPlus.jar dist/spigotplus.properties > dist/SHA256SUMS.txt
          cd dist && zip -9 -r ../SpigotPlus-distribution.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpigotPlus-distribution
          path: |
            target/SpigotPlus.jar
            SpigotPlus-distribution.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/SpigotPlus.jar
            SpigotPlus-distribution.zip
            dist/SHA256SUMS.txt
