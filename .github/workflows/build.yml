name: SpigotPlus Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile SpigotPlus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify server artifact
        run: test -f target/SpigotPlus.jar

      - name: Upload server artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpigotPlus.jar
          path: target/SpigotPlus.jar
          if-no-files-found: error
